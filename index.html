<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinic Offers — Agent Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F8F6;
    --panel: #FFFFFF;
    --ink: #17302B;
    --ink-soft: #52685F;
    --teal: #0E6E5E;
    --teal-deep: #0A4F44;
    --mint: #DFF0E8;
    --coral: #E8623A;
    --coral-soft: #FCE7DE;
    --line: #E0EAE4;
    --amber: #C98A1B;
    --shadow: 0 1px 2px rgba(15,60,50,.04), 0 8px 24px -12px rgba(15,60,50,.15);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(14,110,94,.07) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .wrap{ max-width: 1280px; margin: 0 auto; padding: 0 28px; }

  /* HEADER */
  header{
    background: linear-gradient(135deg, var(--teal-deep), var(--teal) 65%);
    color: #fff;
    padding: 34px 0 90px;
    position: relative;
    overflow: hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-60px; top:-60px;
    width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.10), transparent 70%);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: #BFE9DC; margin-bottom: 10px; display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dot{ width:7px; height:7px; border-radius:50%; background:#7CE8C4; box-shadow:0 0 0 3px rgba(124,232,196,.25); }
  h1{
    font-family: 'Sora', sans-serif; font-weight: 800;
    font-size: clamp(28px, 4vw, 40px);
    margin: 0 0 8px; letter-spacing: -0.02em;
  }
  header p.sub{ margin:0; color: #D8EEE6; font-size: 15px; max-width: 560px; line-height:1.5; }
  .validity-strip{
    margin-top: 22px; display:inline-flex; align-items:center; gap: 10px;
    background: rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    backdrop-filter: blur(4px);
  }

  /* FILTER BAR */
  .filterbar{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 18px 22px;
    margin-top: -56px;
    position: relative; z-index: 5;
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr auto;
    gap: 14px;
    align-items: end;
  }
  .field label{
    display:block; font-size: 11px; font-weight:700; text-transform: uppercase;
    letter-spacing:.06em; color: var(--ink-soft); margin-bottom: 6px;
  }
  .field input, .field select{
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1.5px solid var(--line); background: #FBFDFC;
    font-family: 'Inter', sans-serif; font-size: 14.5px; color: var(--ink);
    outline: none; transition: border-color .15s, background .15s;
    appearance: none;
  }
  .field.select-wrap{ position:relative; }
  .field.select-wrap::after{
    content:"▾"; position:absolute; right:14px; bottom:12px; color: var(--teal); font-size:12px; pointer-events:none;
  }
  .field input:focus, .field select:focus{ border-color: var(--teal); background: #fff; }
  .clear-btn{
    padding: 11px 18px; border-radius: 10px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink-soft); font-weight:600; font-size: 13.5px;
    cursor:pointer; transition: all .15s; white-space:nowrap;
  }
  .clear-btn:hover{ border-color: var(--coral); color: var(--coral); }

  .meta-row{
    display:flex; align-items:center; justify-content: space-between;
    margin-top: 22px; margin-bottom: 4px; flex-wrap: wrap; gap: 10px;
  }
  .count{ font-size: 14px; color: var(--ink-soft); font-weight: 500; }
  .count b{ color: var(--teal-deep); font-weight: 700; }
  .disclaimer{
    margin-top: 26px; padding: 12px 16px; border-radius: 10px;
    background: var(--coral-soft); color: #A8431F; border: 1px solid #F3C2B2;
    font-size: 13.5px; font-weight: 600; text-align:center;
  }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; padding: 5px 10px;
    background: var(--mint); color: var(--teal-deep); border-radius: 7px; font-weight:600;
    display:flex; align-items:center; gap:6px;
  }
  .chip button{
    border:none; background:none; color: var(--teal-deep); cursor:pointer; font-size:13px; line-height:1; padding:0;
    opacity:.6;
  }
  .chip button:hover{ opacity:1; }

  /* CLINIC GROUPS */
  .clinic-group{ margin-top: 30px; }
  .clinic-head{
    display:flex; align-items: baseline; gap: 12px; margin-bottom: 14px;
    padding-bottom: 10px; border-bottom: 2px solid var(--mint);
  }
  .clinic-head h2{
    font-family:'Sora', sans-serif; font-size: 20px; font-weight: 700; margin:0;
    color: var(--teal-deep);
  }
  .clinic-head .n{
    font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft);
    background: var(--bg); border:1px solid var(--line); padding: 3px 9px; border-radius: 999px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }

  /* OFFER CARD — coupon styling */
  .card{
    background: var(--panel);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display:flex; flex-direction:column;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{ transform: translateY(-2px); box-shadow: 0 4px 6px rgba(15,60,50,.06), 0 14px 28px -12px rgba(15,60,50,.22); }

  .card-top{
    padding: 15px 16px 13px;
    display:flex; align-items:flex-start; justify-content: space-between; gap: 10px;
  }
  .service-tag{
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing:.04em;
    background: var(--mint); color: var(--teal-deep); padding: 4px 9px; border-radius: 6px;
  }
  .head-tag{ font-size: 10.5px; color: var(--ink-soft); font-weight:600; }
  .discount{
    font-family:'Sora', sans-serif; font-weight: 800; font-size: 21px; color: var(--coral);
    margin: 0 16px 4px; line-height: 1.1;
  }
  .code-row{
    margin: 0 16px 12px; display:flex; align-items:center; gap:8px;
  }
  .code{
    font-family:'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600;
    background: var(--coral-soft); color: #A8431F; padding: 4px 9px; border-radius: 6px;
    letter-spacing: .02em;
  }
  .divider{
    border-top: 1.5px dashed var(--line); position: relative; margin: 0 0;
  }
  .divider::before, .divider::after{
    content:""; position:absolute; top:-7px; width:14px; height:14px; background: var(--bg);
    border-radius: 50%; border: 1.5px solid var(--line);
  }
  .divider::before{ left:-7px; }
  .divider::after{ right:-7px; }

  .card-body{ padding: 13px 16px 16px; flex:1; display:flex; flex-direction:column; gap:9px; }
  .details{ font-size: 13.5px; color: var(--ink); line-height: 1.45; }
  .attr-row{ display:flex; gap: 8px; font-size: 12.5px; }
  .attr-row .k{ color: var(--ink-soft); min-width: 68px; font-weight:600; flex-shrink:0; }
  .attr-row .v{ color: var(--ink); }
  .attr-row .v.oncall-yes{ color: var(--teal-deep); font-weight:700; }
  .attr-row .v.oncall-cond{ color: var(--amber); font-weight:600; }

  .card-foot{
    margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
    display:flex; align-items:center; justify-content: space-between;
  }
  .validity-badge{
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    background: #F0F5F2; color: var(--ink-soft);
  }
  .validity-badge.weekday{ background:#FDF3DC; color:#8A6415; }
  .validity-badge.all{ background: var(--mint); color: var(--teal-deep); }

  .empty-state{
    text-align:center; padding: 70px 20px; color: var(--ink-soft);
  }
  .empty-state .big{ font-size: 40px; margin-bottom: 10px; }
  .empty-state h3{ font-family:'Sora',sans-serif; color: var(--ink); margin: 0 0 6px; }

  footer{
    text-align:center; padding: 30px 20px 10px; color: var(--ink-soft); font-size: 12.5px;
  }

  @media (max-width: 860px){
    .filterbar{ grid-template-columns: 1fr 1fr; }
    .filterbar .clear-btn{ grid-column: 1 / -1; }
  }
  @media (max-width: 520px){
    .filterbar{ grid-template-columns: 1fr; }
    .wrap{ padding: 0 16px; }
  }
</style>
</head>

<header>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span> AGENT REFERENCE</div>
    <h1>Clinic Offers Dashboard</h1>

    <div class="field select-wrap">
      <label for="serviceFilter">Service</label>
      <select id="serviceFilter"><option value="">All services</option></select>

    <button class="clear-btn" id="clearBtn">Clear filters</button>

  <div class="meta-row">

  </div>

  <div id="results"></div>
</div>

<div class="wrap">
  <div class="disclaimer">⚠️ Offers cannot be clubbed together.</div>
</div>

<footer>Data sourced from Offers – Clinics sheet · Built for internal agent use</footer>

</script>
<script>
(function(){
  const searchEl = document.getElementById('search');
  const clinicEl = document.getElementById('clinicFilter');
  const serviceEl = document.getElementById('serviceFilter');
  const clearBtn = document.getElementById('clearBtn');
  const resultsEl = document.getElementById('results');
  const chipsEl = document.getElementById('activeChips');

  const clinics = [...new Set(OFFERS_DATA.map(d => d.clinic))].sort();
  const services = [...new Set(OFFERS_DATA.map(d => d.service))].filter(s => s && s.toLowerCase() !== 'all services').sort();

  clinics.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    clinicEl.appendChild(o);
  });
  services.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    serviceEl.appendChild(o);
  });

  function validityClass(v){
    const lv = (v||'').toLowerCase();
    if(lv.includes('weekday')) return 'weekday';
    if(lv.includes('all')) return 'all';
    return '';
  }
  function oncallClass(v){
    const lv = (v||'').toLowerCase();
    if(lv === 'yes' || lv.includes('all customers')) return 'oncall-yes';
    if(lv.includes('if') || lv.includes('new')) return 'oncall-cond';
    return '';
  }

  function render(){
    const q = searchEl.value.trim().toLowerCase();
    const clinic = clinicEl.value;
    const service = serviceEl.value;

    let filtered = OFFERS_DATA.filter(d => {
      if(clinic && d.clinic !== clinic) return false;
      if(service && d.service !== service) return false;
      if(q){
        const hay = [d.clinic, d.offer_head, d.service, d.offer_name, d.discount, d.details, d.cohort, d.oncall, d.validity].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });

    // chips
    chipsEl.innerHTML = '';
    if(clinic) addChip('Clinic: ' + clinic, () => { clinicEl.value=''; render(); });
    if(service) addChip('Service: ' + service, () => { serviceEl.value=''; render(); });
    if(q) addChip('“' + searchEl.value.trim() + '”', () => { searchEl.value=''; render(); });

    if(filtered.length === 0){
      resultsEl.innerHTML = `<div class="empty-state"><div class="big">🔎</div><h3>No offers match</h3><p>Try clearing a filter or checking the spelling of your search.</p></div>`;
      return;
    }

    // group by clinic in original data order (unless a specific clinic filter is set)
    const groups = {};
    const order = [];
    filtered.forEach(d => {
      if(!groups[d.clinic]){ groups[d.clinic] = []; order.push(d.clinic); }
      groups[d.clinic].push(d);
    });

    resultsEl.innerHTML = order.map(cname => {
      const items = groups[cname];
      return `
        <div class="clinic-group">
          <div class="clinic-head">
            <h2>${escapeHtml(cname)}</h2>
            <span class="n">${items.length} offer${items.length>1?'s':''}</span>
          </div>
          <div class="grid">
            ${items.map(cardHtml).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  function addChip(label, onRemove){
    const c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = `<span></span><button aria-label="remove">✕</button>`;
    c.querySelector('span').textContent = label;
    c.querySelector('button').addEventListener('click', onRemove);
    chipsEl.appendChild(c);
  }

  function cardHtml(d){
    const vClass = validityClass(d.validity);
    const oClass = oncallClass(d.oncall);
    return `
      <div class="card">
        <div class="card-top">
          <span class="service-tag">${escapeHtml(d.service || '—')}</span>
          <span class="head-tag">${escapeHtml(d.offer_head || '')}</span>
        </div>
        <div class="discount">${escapeHtml(d.discount || '—')}</div>
        <div class="code-row">
          <span class="code">${escapeHtml(d.offer_name || 'NO CODE')}</span>
        </div>
        <div class="divider"></div>
        <div class="card-body">
          <div class="details">${escapeHtml(d.details || '')}</div>
          <div class="attr-row"><span class="k">On-call?</span><span class="v ${oClass}">${escapeHtml(d.oncall || '—')}</span></div>
          <div class="attr-row"><span class="k">Eligible</span><span class="v">${escapeHtml(d.cohort || '—')}</span></div>
          <div class="card-foot">
            <span class="validity-badge ${vClass}">${escapeHtml(d.validity || '—')}</span>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  searchEl.addEventListener('input', render);
  clinicEl.addEventListener('change', render);
  serviceEl.addEventListener('change', render);
  clearBtn.addEventListener('click', () => { searchEl.value=''; clinicEl.value=''; serviceEl.value=''; render(); });

  render();
})();
</script>
